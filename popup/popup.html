<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaLens TR</title><link rel="stylesheet" href="style.css"></head>
<body class="popup"><main id="app">
<header class="topbar"><div class="brand"><span class="brand-mark">ML</span><div><strong>MangaLens TR</strong><small id="version"></small></div></div><div class="header-actions"><select id="ui-language" data-i18n-aria="ui_language_label" class="lang-select"></select><label class="power"><input id="enabled-toggle" type="checkbox" data-i18n-aria="enable_toggle"></label><button id="settings" class="icon-button" data-i18n-aria="settings" data-i18n-title="settings">⚙</button></div></header>
<section id="onboarding" class="card" hidden><h2 data-i18n="onboarding_title"></h2><p class="hint" data-i18n="onboarding_desc"></p><div class="form-actions"><button id="onboarding-done" class="primary" data-i18n="continue_button"></button></div></section>
<nav class="segmented" data-i18n-aria="provider_label"><button id="provider-gemini" aria-pressed="true">Gemini</button><button id="provider-openrouter" aria-pressed="false">OpenRouter</button><button id="provider-ollama" aria-pressed="false">Ollama</button></nav>
<section class="card"><label class="field-label" for="model" data-i18n="model_label"></label><select id="model"></select><div class="key-summary"><span class="dot" id="key-dot"></span><span id="key-summary" data-i18n="keys_loading"></span></div><button id="add-key" class="text-button" hidden data-i18n="add_key"></button><label id="contributor-row" class="check-row" hidden><input id="contributor-consent" type="checkbox"><span data-i18n="contributor_consent"></span></label></section>
<section class="translation-actions"><button class="primary" id="btn-full-chapter" disabled data-i18n="translate_chapter"></button><div class="two-column"><button id="btn-translate-page" disabled data-i18n="select_area"></button><button id="btn-quick-translate" disabled data-i18n="quick"></button></div><p class="hint" data-i18n="full_hint"></p></section>
<footer class="stats" data-i18n-aria="stats_label"><span><span data-i18n="stat_minute"></span> <strong id="ml-stat-minute">0</strong></span><span><span data-i18n="stat_day"></span> <strong id="ml-stat-day">0</strong></span><span><span data-i18n="stat_total"></span> <strong id="ml-stat-lifetime">0</strong></span></footer><p id="notice" role="status" class="notice" hidden></p>
</main><script src="../src/i18n.js"></script><script src="../src/i18n-strings-all.js"></script><script src="../src/providers.js"></script><script src="ui.js"></script><script src="popup.js"></script></body></html>

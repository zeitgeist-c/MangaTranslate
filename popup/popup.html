<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaLens TR</title><link rel="stylesheet" href="style.css"></head>
<body class="popup"><main id="app">
<header class="topbar"><div class="brand"><span class="brand-mark">ML</span><div><strong>MangaLens TR</strong><small id="version"></small></div></div><div class="header-actions"><label class="power"><input id="enabled-toggle" type="checkbox" aria-label="Çeviriyi etkinleştir"></label><button id="settings" class="icon-button" aria-label="Ayarlar" title="Ayarlar">⚙</button></div></header>
<nav class="segmented" aria-label="Çeviri sağlayıcısı"><button id="provider-gemini" aria-pressed="true">Gemini</button><button id="provider-openrouter" aria-pressed="false">OpenRouter</button><button id="provider-ollama" aria-pressed="false">Ollama</button></nav>
<section class="card"><label class="field-label" for="model">Çeviri modeli</label><select id="model"></select><div class="key-summary"><span class="dot" id="key-dot"></span><span id="key-summary">Anahtarlar yükleniyor…</span></div><button id="add-key" class="text-button" hidden>Anahtar ekle →</button><label id="contributor-row" class="check-row" hidden><input id="contributor-consent" type="checkbox">Contributor veri paylaşımı koşullarını kabul ediyorum.</label></section>
<section class="translation-actions"><button class="primary" id="btn-full-chapter" disabled>Bölümün tamamını çevir</button><div class="two-column"><button id="btn-translate-page" disabled>Alan Seç</button><button id="btn-quick-translate" disabled>Oto Çevir</button></div><p class="hint">Tam bölüm önizleme · Belirsiz alanlar kontrol gerektirir.</p></section>
<footer class="stats" aria-label="Çeviri istatistikleri"><span>Dakika <strong id="ml-stat-minute">0</strong></span><span>Bugün <strong id="ml-stat-day">0</strong></span><span>Toplam <strong id="ml-stat-lifetime">0</strong></span></footer><p id="notice" role="status" class="notice" hidden></p>
</main><script src="../src/providers.js"></script><script src="ui.js"></script><script src="popup.js"></script></body></html>

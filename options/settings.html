<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaLens TR · Settings</title><link rel="stylesheet" href="../popup/style.css"></head>
<body><main class="settings-shell"><header class="topbar"><div class="brand"><span class="brand-mark">ML</span><div><strong>MangaLens TR</strong><small data-i18n="settings"></small></div></div><select id="ui-language" data-i18n-aria="ui_language_label" class="lang-select"></select><span id="version" class="muted"></span></header>
<div class="settings-layout"><nav class="settings-nav" data-i18n-aria="nav_sections"><button data-section="keys" aria-selected="true" data-i18n="nav_keys"></button><button data-section="preferences" aria-selected="false" data-i18n="nav_prefs"></button><button data-section="about" aria-selected="false" data-i18n="nav_about"></button></nav><div class="settings-content"><p id="notice" class="notice" role="status" hidden></p>
<section id="section-keys"><h1 data-i18n="keys_title"></h1><p class="section-description" data-i18n="keys_desc"></p>
<nav class="segmented" data-i18n-aria="provider_section_label"><button id="keys-gemini" aria-pressed="true">Gemini</button><button id="keys-openrouter" aria-pressed="false">OpenRouter</button><button id="keys-ollama" aria-pressed="false">Ollama</button></nav>
<div id="key-list" aria-live="polite"></div><form id="add-form" class="card"><h2 data-i18n="add_form_title"></h2><div class="form-grid"><label class="field" for="new-label"><span data-i18n="label_field"></span><input id="new-label" type="text" maxlength="80" data-i18n-ph="label_ph" autocomplete="off"></label><label class="field" for="new-key"><span data-i18n="key_field"></span><input id="new-key" type="password" minlength="20" maxlength="512" required autocomplete="off" spellcheck="false" data-i18n-ph="key_ph"></label></div><small data-i18n="key_storage_note"></small><div class="form-actions"><button id="add-button" class="primary" type="submit" data-i18n="add_button"></button></div></form>
<p class="hint" data-i18n="check_hint"></p><a href="https://openrouter.ai/settings/preferences" target="_blank" rel="noopener noreferrer" id="router-help" hidden>OpenRouter hesap tercihlerini aç ↗</a></section>
<section id="section-preferences" hidden><h1 data-i18n="prefs_title"></h1><form id="preferences-form"><div class="card"><h2 data-i18n="group_reading"></h2><div class="form-grid"><label class="field" for="content-type"><span data-i18n="content_type"></span><select id="content-type"><option value="auto" data-i18n="ct_auto"></option><option value="manga">Manga</option><option value="manhwa">Manhwa</option><option value="manhua">Manhua</option></select></label><label class="field" for="local-detector"><span data-i18n="local_detector"></span><select id="local-detector"><option value="fast" data-i18n="det_fast"></option><option value="small" data-i18n="det_small"></option><option value="detailed" data-i18n="det_detailed"></option></select></label><label class="field" for="font-size"><span data-i18n="font_size"></span><select id="font-size"><option value="16" data-i18n="fs_normal"></option><option value="20" data-i18n="fs_large"></option></select></label><label class="field" for="series-name"><span data-i18n="series_name"></span><input id="series-name" type="text" maxlength="200" data-i18n-ph="optional_ph"></label></div><small data-i18n="font_hint"></small></div>
<div class="card"><h2 data-i18n="group_terms"></h2><label class="field" for="translation-instructions"><span data-i18n="instr_label"></span><textarea id="translation-instructions" maxlength="1500" data-i18n-ph="instr_ph"></textarea></label><label class="field" for="translation-glossary"><span data-i18n="glossary_label"></span><textarea id="translation-glossary" maxlength="6000" data-i18n-ph="glossary_ph"></textarea></label><label class="check-row"><input id="contributor-consent" type="checkbox"><span data-i18n="contributor_consent"></span></label></div><div class="card"><h2 data-i18n="gemini_behavior"></h2><label class="check-row"><input id="gemini-fallback" type="checkbox"><span data-i18n="gemini_fallback_label"></span></label></div><div class="form-actions savebar"><span class="muted" id="dirty-status" data-i18n="no_changes"></span><button type="submit" class="primary" id="save-preferences" data-i18n="save_button"></button></div></form></section>
<section id="section-about" hidden><h1 data-i18n="nav_about"></h1><div class="card"><h2>MangaLens TR</h2><p data-i18n="product_blurb"></p><p class="hint" data-i18n="about_preview"></p><p class="hint" data-i18n="about_local"></p><p class="hint" data-i18n="about_storage"></p><button id="refresh-models" data-i18n="check_catalog"></button><p id="model-availability" class="hint"></p></div></section>
</div></div></main><script src="../src/i18n.js"></script><script src="../src/i18n-strings.js"></script><script src="../src/providers.js"></script><script src="../popup/ui.js"></script><script src="settings.js"></script></body></html>
